# Spring properties
spring.application.name=kafka-producer

# Server properties
server.port=9091

# Logging properties
logging.level.root=INFO

# Datasource properties
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=password
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Kafka properties
spring.kafka.bootstrap-servers=PLAINTEXT://localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.producer.properties.spring.json.add.type.headers=true

# App Kafka properties
app.kafka.topics.message-created.name=message.created
app.kafka.topics.message-created.partitions=3
app.kafka.topics.message-created.replicas=1
app.kafka.topics.message-created.retention=7d
